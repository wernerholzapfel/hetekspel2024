<ion-col>
  <ion-chip [color]="color">
    <ion-icon [name]="iconName"></ion-icon>
    <ion-label>
      {{ points }}
      @if (deltaPoints > 0) {
      <ion-text [color]="color" class="hes-delta-text">
        (+{{ deltaPoints }})
      </ion-text>
      }
    </ion-label>
  </ion-chip>
</ion-col>
