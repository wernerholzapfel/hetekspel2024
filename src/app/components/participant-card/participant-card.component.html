@if (standLine) {
<ion-card [color]="backgroundcolor">
  <ion-card-header>
    <ion-card-title>{{ ownCard ? "Jij" : standLine?.displayName }} staat
      {{ standLine.position }}e
      {{
      ownCard ? "met " + standLine.totalPoints + " punten" : ""
      }}</ion-card-title>
    <ion-card-subtitle>{{ lastUpdated | fromNow }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <ion-grid class="ion-no-padding">
      <ion-row class="ion-align-items-stretch">
        <app-punten-chip (click)="openStand()" [iconName]="'podium-outline'" [color]="color"
          [deltaPoints]="standLine.deltaTotalPoints" [points]="standLine.totalPoints"></app-punten-chip>
        <app-punten-chip (click)="openMatches()" [iconName]="'football'" [deltaPoints]="standLine.deltaMatchPoints"
          [color]="color" [points]="standLine.matchPoints"></app-punten-chip>
        <app-punten-chip (click)="openPoules()" [iconName]="'list'" [deltaPoints]="standLine.deltaPoulePoints"
          [color]="color" [points]="standLine.poulePoints"></app-punten-chip>
        <app-punten-chip (click)="openKnockout()" [iconName]="'trophy'" [deltaPoints]="standLine.deltaKnockoutPoints"
          [color]="color" [points]="standLine.knockoutPoints"></app-punten-chip>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
}
