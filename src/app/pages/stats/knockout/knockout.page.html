<ion-header>
  <app-menu-toolbar title="Knockouts"></app-menu-toolbar>
</ion-header>
<ion-content>
  <ion-grid>
    <ion-row class="ion-no-padding">
      <ion-col size="12" class="ion-no-padding">
        <div class="alert-banner alert-secondary">
          <ion-card-content>
            De statistieken van de finaleronde laten zien hoevaak een team
            gekozen is in die specifieke ronde.
          </ion-card-content>
        </div>
      </ion-col>
    </ion-row>
    @for (knockout of knockoutStats; track knockout) {
    <ion-row>
      <ion-col>{{knockout.round | roundText}} </ion-col>
    </ion-row>
    @for (team of knockout.teams; track team) { @if (team.count > 0) {
    <ion-item lines="full" (click)="openKoTeam(team.id, knockout.round)">
      <!-- <ion-row *ngIf="team.count > 0" class="hes-border-bottom" (click)="openKoTeam(team.id, knockout.round)"> -->
      <!-- <ion-col size="6" class="ion-padding ion-text-start hes-background"> -->
      <ion-text>
        <span class="fi fi-{{team.logoUrl}} fis"></span>
        {{team.name}}
      </ion-text>
      <!-- </ion-col> -->
      <!-- <ion-col size="6" class="ion-padding ion-text-end hes-background"> -->
      <ion-text slot="end"> {{team.count}} </ion-text>
      <!-- </ion-col> -->
      <!-- </ion-row> -->
    </ion-item>
    } } }
  </ion-grid>
</ion-content>
