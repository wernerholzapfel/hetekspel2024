<ion-header>
  <app-menu-toolbar title="Eindstanden"></app-menu-toolbar>
</ion-header>

<ion-content>
  <ion-grid class="ion-no-padding">
    <ion-row>
      @for (poule of poules; track poule) {
      <ion-col size="12" size-md="6" size-lg="6" size-xl="4">
        <app-stand-card
          [poule]="poule"
          [stand]="poule.stand"
          [admin]="true"
          [editMode]="true"
        ></app-stand-card>
      </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
