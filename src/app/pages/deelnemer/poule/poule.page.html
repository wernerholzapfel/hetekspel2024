<ion-header>
  <ion-toolbar mode="ios">
    <ion-title>poule</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-card class="message" color="tertiary">
    @if (standLine) {
    <ion-card-content>
      {{standLine?.displayName}} staat {{standLine?.position}}e met
      {{standLine?.totalPoints}} punten, waarvan {{standLine?.poulePoints}}
      punten voor de poulestanden.
    </ion-card-content>
    }
  </ion-card>
  <ion-grid class="ion-no-padding">
    <ion-row>
      @for (poule of poules; track poule) {
      <ion-col size="12" size-md="6" size-lg="6" size-xl="4">
        <app-stand-card
          [poule]="poule"
          [stand]="poule?.stand"
          [admin]="false"
          [editMode]="false"
        ></app-stand-card>
      </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
