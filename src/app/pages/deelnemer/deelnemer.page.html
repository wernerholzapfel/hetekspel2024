<ion-header mode="ios">
  <app-menu-toolbar
    [rightCornerIcon]="toolbarAction?.icon || ''"
    (emitIconClick)="toolbarAction?.handler()"
  ></app-menu-toolbar>
</ion-header>
<ion-tabs (ionTabsDidChange)="onTabChange($event)">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="matches">
      <ion-icon name="football"></ion-icon>
      <ion-label>Wedstrijden</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="poule">
      <ion-icon name="list"></ion-icon>
      <ion-label>Poulestanden</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="knockout">
      <ion-icon name="trophy"></ion-icon>
      <ion-label>Finaleronde</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
